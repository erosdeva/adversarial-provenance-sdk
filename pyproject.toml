
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-provenance-sdk"
version = "0.2.0"
description = "Enterprise-grade adversarial provenance middleware"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["adversarial_provenance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
